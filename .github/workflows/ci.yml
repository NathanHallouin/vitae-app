# Ce qui garde le vert entre deux commits.
#
# L'ordre n'est pas indifférent : `bun run generate` vient en premier, parce que le reste en
# dépend. `recettes.generated.ts` est importé par les écrans, et la feuille de jetons est lue par
# NativeWind — sans eux, la vérification de types échoue pour une raison qui n'a rien à voir avec
# le code écrit.
#
# La CI est le seul endroit où le dépôt est vu tel qu'il est cloné. Une machine de développement
# porte des fichiers engendrés depuis le premier `expo start` qui masquent complètement certains
# manques : c'est ainsi qu'un typecheck vert ici a échoué là. `apps/app/types.d.ts` existe pour
# cette raison.
#
# La dernière étape vérifie que les fichiers engendrés committés correspondent bien à leur source.
# Sans elle, une recette modifiée sans recompilation passerait la CI et sortirait absente du
# paquet.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Fichiers engendrés
        run: bun run generate

      - name: Format et règles
        run: bun run check

      - name: Types
        run: bun run typecheck

      - name: Tests
        run: bun test packages

      - name: Export du site
        run: bun run --cwd apps/app export:web

      - name: Service worker
        # Après l'export, jamais avant : il nomme le paquet et la feuille de style, dont
        # l'empreinte n'existe qu'une fois l'export fait.
        run: bun run sw

      - name: Le HTML livré contient bien le contenu
        # Une page vide passerait toutes les étapes précédentes : c'est exactement ce qui est arrivé
        # au premier export, quand la racine attendait des polices qui ne se chargent jamais dans
        # Node. Le pré-rendu se vérifie sur le fichier produit, pas sur le code.
        run: |
          verifie() {
            page="apps/app/dist/$1"
            grep -q "<title[^>]*>." "$page" || { echo "titre vide dans $page"; exit 1; }
            grep -q 'rel="canonical"' "$page" || { echo "canonique absente de $page"; exit 1; }
            grep -q "$2" "$page" || { echo "contenu absent de $page"; exit 1; }
          }
          # L'accueil en premier : c'est la page la plus visitée, et celle qui est sortie vide
          # le jour où `/` n'était qu'une redirection.
          verifie index.html 'Combien votre corps'
          verifie metabolisme.html 'Mon métabolisme'
          verifie recettes/index.html 'Recettes'

          # Le cours porte désormais les seize notions, une par route. C'est la seule famille de
          # pages du site dont le contenu est entier sans profil : le texte complet doit donc s'y
          # trouver, pas seulement le résumé.
          verifie comprendre/index.html 'Seize notions'
          verifie comprendre/comment-il-est-calcule.html 'Par l’équation de Mifflin-St Jeor'
          verifie comprendre/les-seances.html 'une séance de renforcement en dépense'

          # Les écrans de résultats, eux, ne portent plus les explications : ils finissent par le
          # renvoi vers l'écran suivant, qui est ce qui fait des quatre onglets un parcours.
          verifie metabolisme.html 'Ce que ces chiffres changent dans l’assiette'
          verifie bouger.html 'Des recettes pour tenir ces repères'
          # Les réglages : le site y dit pourquoi les rappels de mouvement n'existent vraiment que
          # dans l'application.
          verifie reglages.html 'ne sonne que si l’onglet est resté ouvert'
          # Le thème, lui, est sur le profil et non dans les réglages — c'est un choix écrit dans
          # les deux écrans, et cette assertion l'avait d'abord contredit en visant `reglages.html`,
          # où le texte n'a jamais été. Une assertion fausse sur une règle vraie : elle aurait fait
          # rougir la CI en accusant le code.
          verifie profil.html 'Le thème sombre reprend'
          verifie confidentialite.html 'aucune donnée'

          recette=apps/app/dist/recettes/omelette-aux-champignons.html
          verifie recettes/omelette-aux-champignons.html 'Omelette aux champignons'
          grep -q 'application/ld+json' "$recette" || { echo "JSON-LD absent de $recette"; exit 1; }

      - name: Le HTML livré a une structure
        # Trois défauts qui ne se voient pas à l'écran et que rien d'autre n'attrape.
        #
        # Un `Pressable` qui appelle le routeur rend un `<div>` : l'accueil est sorti sans un seul
        # `<a>`, donc sans aucun chemin qu'un moteur puisse suivre vers le reste du site.
        # `accessibilityRole="header"` sans `aria-level` rend un `<h1>`, toujours : une page de
        # recette en portait deux et pas un seul `<h2>`. Et une page sans `<main>` n'a pas de
        # contenu principal à atteindre, ni pour un lien d'évitement ni pour un lecteur d'écran.
        run: |
          structure() {
            page="apps/app/dist/$1"
            n=$(grep -o '<h1[ >]' "$page" | wc -l)
            [ "$n" = "1" ] || { echo "$page : $n <h1>, il en faut exactement un"; exit 1; }
            grep -q '<main[ >]' "$page" || { echo "$page : pas de <main>"; exit 1; }
            # Un titre **non vide** : `<title data-rh="true">` suivi de rien passait tous les
            # contrôles précédents, et c'est exactement ce que livrait la page introuvable.
            grep -q '<title[^>]*>[^<]' "$page" || { echo "$page : <title> vide"; exit 1; }
          }
          # **Toutes** les pages livrées, et non une liste écrite à la main. La liste avait douze
          # entrées et laissait passer la page introuvable, exportée sans `<title>`, sans `<h1>`,
          # sans `<main>` et sans consigne d'indexation — c'est-à-dire une page indexable au titre
          # vide, sur la seule adresse qu'un robot finit toujours par visiter. Une vérification qui
          # énumère ne protège que ce qu'on a pensé à y mettre.
          #
          # `find` et non un glob : les recettes et les notions sont dans des sous-dossiers, et
          # leur nombre change à chaque ajout de contenu.
          while IFS= read -r page; do
            structure "${page#apps/app/dist/}"
          done < <(find apps/app/dist -name '*.html' | sort)

          # Les gabarits de routes dynamiques ne se livrent pas : `tools/build-sw.ts` les retire, et
          # ce contrôle est ce qui garantit qu'il l'a fait. Sans lui, une mise à jour d'Expo Router
          # qui renommerait ces fichiers les remettrait en ligne sans que rien ne le dise.
          restants=$(find apps/app/dist -name '*[[]*[]]*' -o -name '_sitemap.html' || true)
          if [ -n "$restants" ]; then
            echo "gabarits non résolus livrés :"
            echo "$restants"
            exit 1
          fi

          # L'accueil doit mener quelque part : le catalogue de recettes est la porte que
          # l'acquisition emprunte, le cours celle qui n'exige rien du visiteur.
          grep -q '<a [^>]*href="/recettes"' apps/app/dist/index.html \
            || { echo "l'accueil n'a aucun lien vers /recettes"; exit 1; }
          grep -q '<a [^>]*href="/comprendre"' apps/app/dist/index.html \
            || { echo "l'accueil n'a aucun lien vers /comprendre"; exit 1; }

          # La navigation est faite de vrais liens, et elle est dans le HTML livré : c'est par elle
          # qu'un moteur passe d'une page à l'autre. Les quatre sections sur tout écran qui en fait
          # partie, et le second niveau sur les quatre écrans de résultats.
          for page in metabolisme.html recettes/index.html comprendre/index.html profil.html; do
            for cible in /metabolisme /recettes /comprendre /profil; do
              grep -q "<a [^>]*href=\"$cible\"" "apps/app/dist/$page" \
                || { echo "$page : la barre des sections ne lie pas $cible"; exit 1; }
            done
          done
          for cible in /alimentation /poids /bouger; do
            grep -q "<a [^>]*href=\"$cible\"" apps/app/dist/metabolisme.html \
              || { echo "le second niveau ne lie pas $cible"; exit 1; }
          done

          # L'en-tête ne porte plus que la marque : une commande qui y reviendrait serait hors de
          # portée du pouce, et rétrécirait la marque jusqu'à la tronquer.
          if grep -q '<a [^>]*href="/reglages"' apps/app/dist/recettes/index.html; then
            echo "une commande de réglage est revenue dans l'en-tête"
            exit 1
          fi

          # Le sommaire du cours mène à ses seize notions. Une page qui les listerait sans les
          # lier laisserait seize routes orphelines, que rien ne ferait découvrir.
          notions=$(grep -o 'href="/comprendre/[a-z0-9-]*"' apps/app/dist/comprendre/index.html \
            | sort -u | wc -l)
          [ "$notions" = "16" ] \
            || { echo "le sommaire du cours lie $notions notions, 16 attendues"; exit 1; }

          # Le catalogue est une liste, et chaque recette y est un lien suivi d'un titre de
          # niveau 2 : c'est ce qui en fait un sommaire plutôt qu'un tas de cartes.
          grep -q '<ul[ >]' apps/app/dist/recettes/index.html \
            || { echo "le catalogue n'est pas une liste"; exit 1; }
          h2=$(grep -o '<h2[ >]' apps/app/dist/recettes/index.html | wc -l)
          [ "$h2" -ge 60 ] || { echo "catalogue : $h2 titres de recette, attendu 60 au moins"; exit 1; }

          # Le site est installable : sans manifeste joignable, le navigateur ne le propose pas.
          test -f apps/app/dist/manifest.json || { echo "manifest.json absent de l'export"; exit 1; }
          grep -q 'rel="manifest"' apps/app/dist/index.html \
            || { echo "le manifeste n'est pas lié depuis le document"; exit 1; }
          for icone in icone-192.png icone-512.png icone-maskable-512.png apple-touch-icon.png; do
            test -f "apps/app/dist/$icone" || { echo "$icone absente de l'export"; exit 1; }
          done

          # Sans service worker, Chrome ne propose pas l'installation — et une application
          # installée ouverte hors ligne montrerait la page d'erreur du navigateur.
          test -f apps/app/dist/sw.js || { echo "sw.js absent de l'export"; exit 1; }
          node --check apps/app/dist/sw.js || { echo "sw.js n'est pas du JavaScript valide"; exit 1; }
          grep -q "serviceWorker.register" apps/app/dist/index.html \
            || { echo "le service worker n'est pas enregistré depuis le document"; exit 1; }
          # Le paquet doit être précaché sous le nom qu'il porte vraiment : c'est l'erreur que
          # produirait un `sw.js` engendré avant l'export.
          paquet=$(basename apps/app/dist/_expo/static/js/web/*.js)
          grep -q "$paquet" apps/app/dist/sw.js \
            || { echo "sw.js ne précache pas le paquet $paquet"; exit 1; }

      - name: L'export tient ses règles de référencement
        # Deux propriétés que la CI ne pouvait pas exprimer en `grep`, parce qu'elles comparent des
        # ensembles : chaque page se canonise elle-même, et le sitemap correspond exactement aux
        # pages indexables livrées.
        #
        # Elles tenaient déjà quand ce contrôle a été écrit. Il ne corrige rien — il empêche une
        # régression qui ne se manifesterait que dans les statistiques de référencement, des mois
        # plus tard : deux pages qui revendiquent la même adresse en font disparaître une des
        # résultats, sans erreur et sans alerte.
        run: bun run verifie:export

      - name: Seules les polices utilisées sont livrées
        # Importer une coupe de `@expo-google-fonts` enregistre la famille entière : trente-six
        # fichiers et 7,7 Mo partaient dans l'export pour les coupes affichées. Le jour où un
        # écran réimporte le paquet au lieu de passer par `src/lib/polices.ts`, tout revient — et
        # rien ne le signalerait, l'application ayant exactement le même aspect.
        #
        # Trois coupes depuis la refonte « Cadran », contre cinq : une seule famille porte les
        # titres, les libellés et les chiffres.
        run: |
          embarquees=$(find apps/app/dist/assets -name "*.ttf" | wc -l)
          [ "$embarquees" = "0" ] \
            || { echo "$embarquees polices embarquées par Metro : un écran importe-t-il @expo-google-fonts ?"; exit 1; }

          livrees=$(find apps/app/dist/polices -name "*.woff2" | wc -l)
          [ "$livrees" = "3" ] || { echo "$livrees woff2 dans dist/polices, 3 attendus"; exit 1; }
          # Le TTF entier n'a rien à faire sur le site : il ne sert qu'au natif.
          [ "$(find apps/app/dist/polices -name "*.ttf" | wc -l)" = "0" ] \
            || { echo "des TTF entiers sont livrés au site"; exit 1; }

          for coupe in SpaceGrotesk_400Regular SpaceGrotesk_700Bold; do
            grep -q "rel=\"preload\"[^>]*$coupe.woff2" apps/app/dist/index.html \
              || { echo "$coupe n'est pas préchargée"; exit 1; }
          done
          # La coupe des libellés ne se précharge pas : elle se demande à la découverte du texte
          # qui l'emploie. La précharger volerait de la bande passante aux deux autres.
          #
          # `if` et non `grep && exit` : le shell de la CI s'arrête au premier échec, et un `grep`
          # qui ne trouve rien — le cas nominal ici — sortirait 1 et ferait échouer l'étape.
          if grep -q 'rel="preload"[^>]*SpaceGrotesk_500Medium.woff2' apps/app/dist/index.html; then
            echo "la coupe des libellés est préchargée à tort"
            exit 1
          fi
          grep -q "@font-face" apps/app/dist/index.html \
            || { echo "les @font-face ne sont pas dans le document"; exit 1; }

      - name: Les règles du dépôt sont tenues
        # Deux règles qu'`AGENTS.md` énonce depuis le premier jour et que rien ne vérifiait. Elles
        # avaient toutes deux été enfreintes sans que personne ne le voie — c'est ce que produit
        # une règle écrite en français et jamais exécutée.
        run: |
          # 1. Aucune différence web / natif décidée à l'exécution. Elle passe par un fichier que
          #    Metro choisit. Les distinctions iOS / Android restent admises : aucun fichier `.web`
          #    ne sait les exprimer.
          # Les lignes de commentaire sont écartées : plusieurs en-têtes citent la règle et
          # l'ancien code qu'elle a remplacé. `[[:space:]]` et non `\s`, que grep ne lit pas.
          fautes=$(grep -rn "Platform.OS" apps/app/app apps/app/src/components \
            | grep -v ':[[:space:]]*\*' | grep -v ':[[:space:]]*//' | grep "'web'" || true)
          if [ -n "$fautes" ]; then
            echo "Test de plateforme web / natif hors d'un fichier .web :"
            echo "$fautes"
            exit 1
          fi

          # 2. Le métier ne connaît aucune plateforme. Sans cela, il cesse d'être testable sans
          #    environnement de rendu — et c'est ce qui fait tourner les 270 tests en 160 ms.
          interdits=$(grep -rnE "from '(react|react-native|node:)" packages/core/src || true)
          if [ -n "$interdits" ]; then
            echo "packages/core importe une dépendance de plateforme :"
            echo "$interdits"
            exit 1
          fi

      - name: Les fichiers engendrés sont à jour
        # `bun run generate` a été lancé en première étape : tout fichier engendré qui diffère de
        # sa version committée est donc une divergence entre une source et sa copie.
        #
        # La vérification ne portait que sur les recettes. Elle porte désormais sur **tous** les
        # fichiers engendrés, parce que le défaut qu'elle attrape est le même : une source
        # modifiée sans que sa copie suive, et rien pour le signaler. C'est exactement ce qui
        # était arrivé à l'échelle typographique, recopiée à la main dans `tailwind.config.js`
        # pendant que `tokens.ts` se déclarait source unique.
        run: |
          engendres=$(git ls-files | grep -E '\.generated\.|tailwind\.generated\.js')
          if ! git diff --quiet -- $engendres; then
            echo "Des fichiers engendrés ne correspondent plus à leur source."
            echo "Lancer 'bun run generate' et committer le résultat."
            git --no-pager diff --stat -- $engendres
            exit 1
          fi
